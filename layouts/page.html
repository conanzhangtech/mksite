{{ define "main" }}
<article class="container section">
  <h1 class="page-title">{{ .Title }}</h1>
  {{- with .Description }}<p class="page-lede">{{ . }}</p>{{ end }}
  {{- if .Params.showDate }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>{{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
